name: Validate
on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/task-submissions]
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --include=dev
      - run: npm run build
      - name: Check server TypeScript syntax
        run: for file in server/*.ts; do node --experimental-strip-types --check "$file"; done
