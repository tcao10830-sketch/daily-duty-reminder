services:
  - type: web
    name: daily-duty-reminder
    runtime: node
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22.13.1
      - key: NODE_ENV
        value: production
    disk:
      name: daily-duty-reminder-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
